<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Management System</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --primary:#2563eb; --primary-dark:#1d4ed8; --border:#e2e8f0;
  --success:#16a34a; --danger:#dc2626; --warning:#f59e0b;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8;
    --border:#334155; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8;
  --border:#334155; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0);
  -webkit-tap-highlight-color:transparent;
}
header{
  background:var(--primary); color:#fff;
  padding:14px 16px; font-weight:700; font-size:17px;
  display:flex; justify-content:space-between; align-items:center;
  position:sticky; top:0; z-index:10;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
}
header .h-title{display:flex;align-items:center;gap:8px}
header .h-actions{display:flex;gap:6px}
header button{
  background:rgba(255,255,255,.15); color:#fff; border:0;
  padding:8px 12px; border-radius:8px; font-size:13px;
  font-weight:600; cursor:pointer;
}
header button:active{background:rgba(255,255,255,.3)}
nav{
  display:flex; gap:6px; overflow-x:auto; padding:10px 12px;
  background:var(--card); border-bottom:1px solid var(--border);
  position:sticky; top:calc(52px + env(safe-area-inset-top,0px));
  z-index:9; scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:none; border:1px solid var(--border); background:var(--bg);
  color:var(--text); padding:8px 14px; border-radius:20px;
  font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap;
}
nav button.on{background:var(--primary); color:#fff; border-color:var(--primary)}
main{padding:12px; max-width:1000px; margin:0 auto}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:12px}
.card{
  background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:14px; margin-bottom:10px;
  box-shadow:var(--shadow);
}
.card h3{
  font-size:15px; margin-bottom:10px; font-weight:700;
  display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;
}
.stat{text-align:left}
.stat span{color:var(--muted); font-size:12px; display:block}
.stat b{display:block; font-size:21px; margin-top:4px; font-weight:700}
.pos{color:var(--success)} .neg{color:var(--danger)} .warn{color:var(--warning)}
form{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px}
label{font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:4px}
input,select,textarea{
  padding:10px; border:1px solid var(--border); border-radius:8px;
  background:var(--bg); color:var(--text); font-size:15px; width:100%;
  font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary); outline-offset:-1px}
.btn{
  background:var(--primary); color:#fff; border:0; border-radius:8px;
  padding:11px 16px; font-size:14px; font-weight:600; cursor:pointer;
  align-self:end;
}
.btn:active{background:var(--primary-dark)}
.btn.s{background:var(--bg); color:var(--text); border:1px solid var(--border)}
.btn.d{background:var(--danger)}
.btn.g{background:var(--success)}
.btn.sm{padding:6px 10px; font-size:13px}
.row-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.icon-btn{
  background:none; border:0; cursor:pointer; padding:4px 6px;
  font-size:15px; border-radius:6px; line-height:1; color:var(--text);
}
.icon-btn:hover{background:var(--bg)}
.w{overflow-x:auto; margin:0 -14px; padding:0 14px}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th,td{text-align:left; padding:9px 8px; border-bottom:1px solid var(--border); white-space:nowrap}
th{color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.3px}
tbody tr:hover{background:var(--bg)}
.badge{
  display:inline-block; padding:3px 9px; border-radius:10px;
  font-size:11px; font-weight:700; text-transform:uppercase; border:0;
}
.badge.paid{background:rgba(22,163,74,.15); color:var(--success)}
.badge.part{background:rgba(245,158,11,.18); color:var(--warning)}
.badge.unpaid{background:rgba(220,38,38,.15); color:var(--danger)}
.badge.left{background:rgba(100,116,139,.18); color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  border-radius:12px; padding:10px 14px; text-align:center;
  font-size:13px; cursor:pointer; font-weight:500;
}
.chip.on{background:var(--primary); color:#fff; border-color:var(--primary)}
.srow{
  padding:10px; border:1px solid var(--border); border-radius:10px;
  margin-bottom:6px; cursor:pointer;
}
.srow.sel{border-color:var(--primary); background:rgba(37,99,235,.08)}
.empty{text-align:center; padding:30px 20px; color:var(--muted); font-size:13.5px}
.modal-bg{
  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100;
  display:none; align-items:center; justify-content:center; padding:16px;
}
.modal-bg.show{display:flex}
.modal{
  background:var(--card); border-radius:14px; padding:20px;
  max-width:460px; width:100%; max-height:90vh; overflow-y:auto;
  box-shadow:0 10px 40px rgba(0,0,0,.3);
}
.modal.wide{max-width:700px}
.modal h3{margin-bottom:12px; font-size:16px}
.modal p{color:var(--muted); font-size:13.5px; margin-bottom:12px; line-height:1.5}
.modal input,.modal select{margin-bottom:6px}
.modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap}
.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(100px);
  background:var(--text); color:var(--card); padding:12px 20px;
  border-radius:10px; font-size:14px; font-weight:500; z-index:200;
  transition:transform .3s; max-width:90vw;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--success); color:#fff}
.toast.err{background:var(--danger); color:#fff}
.tabs{display:flex; gap:6px; margin-bottom:12px; border-bottom:1px solid var(--border)}
.tabs button{
  background:none; border:0; padding:10px 14px; font-size:14px;
  color:var(--muted); font-weight:600; cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tabs button.on{color:var(--primary); border-bottom-color:var(--primary)}
.hint{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5}
.bars{display:flex; align-items:flex-end; gap:10px; height:130px; padding-top:8px}
.bgrp{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end}
.bpair{display:flex; align-items:flex-end; gap:3px; height:100%; width:100%; justify-content:center}
.bar{width:40%; max-width:22px; border-radius:4px 4px 0 0; min-height:2px}
.bar.in{background:var(--success)} .bar.out{background:var(--danger)}
.bgrp small{font-size:10px; color:var(--muted)}
.legend{font-size:12px; color:var(--muted); margin-top:6px}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin:0 4px 0 8px}
.warnbox{background:rgba(245,158,11,.15); border:1px solid var(--warning); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:10px}
.attbtn{border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:10px; padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer}
.attbtn.p{background:var(--success); color:#fff; border-color:var(--success)}
.attbtn.a{background:var(--danger); color:#fff; border-color:var(--danger)}
.attbtn.l{background:var(--warning); color:#fff; border-color:var(--warning)}
#printArea{display:none}
.menu-btn{background:rgba(255,255,255,.15)!important; font-size:18px!important; padding:6px 12px!important; line-height:1}
.drawer{position:fixed; top:0; bottom:0; left:0; width:300px; max-width:84vw; background:#14213d; color:#e2e8f0; z-index:60;
  transform:translateX(-100%); transition:transform .25s ease; display:flex; flex-direction:column; overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.drawer.open{transform:translateX(0); box-shadow:0 0 40px rgba(0,0,0,.5)}
.dr-top{display:flex; align-items:center; gap:12px; margin-bottom:16px}
.dr-top img{width:52px; height:52px; border-radius:50%; background:#fff; object-fit:cover; flex:none}
.dr-top .nm{flex:1; min-width:0; font-weight:800; font-size:17px; line-height:1.2; color:#fff}
.dr-top .nm small{display:block; font-weight:500; font-size:11px; letter-spacing:1.5px; color:#94a3b8; margin-top:3px; text-transform:uppercase}
.dr-close{background:#f1f5f9; color:#0f172a; border:0; border-radius:12px; width:42px; height:42px; font-size:18px; cursor:pointer; flex:none}
.dr-card{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:12px; margin-bottom:10px; font-size:13px; color:#94a3b8}
.dr-card b{display:block; color:#fff; font-size:14px; margin-bottom:2px}
.dr-sec{font-size:11px; letter-spacing:2.5px; color:#64748b; font-weight:700; margin:18px 6px 8px; text-transform:uppercase}
.dr-item{display:flex; align-items:center; gap:14px; width:100%; background:none; border:0; color:#cbd5e1; font-size:16px; font-weight:600;
  padding:13px 14px; border-radius:12px; cursor:pointer; text-align:left}
.dr-item:hover{background:rgba(255,255,255,.07)}
.dr-item.on{background:#14a08a; color:#fff; box-shadow:0 6px 16px rgba(20,160,138,.35)}
.dr-item .ic{width:22px; text-align:center; font-size:17px}
.dr-foot{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.12)}
.dr-ov{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:55; display:none}
.dr-ov.show{display:block}
@media(min-width:960px){
  .drawer{transform:none!important; box-shadow:none; z-index:20; width:270px}
  .dr-ov{display:none!important}
  .dr-close,.menu-btn{display:none!important}
  header,main{margin-left:270px}
  header{position:sticky}
}
@page{size:A4; margin:0}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important; color:#000; background:#fff; padding:12mm; position:relative}
  .wm{position:fixed!important; top:25%; height:50%; left:0; right:0; display:flex!important; justify-content:center; align-items:center; z-index:0; pointer-events:none; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .wm img{height:100%; width:auto; max-width:90%; object-fit:contain; opacity:.13}
  .pcontent{position:relative; z-index:1}
  body{background:#fff}
}
@media print{ body.print-report>*:not(#printArea):not(.report-wrap){display:none!important} }
</style>
</head>
<body>

<header>
  <div class="h-title"><button class="menu-btn" onclick="openMenu()" aria-label="Menu" style="border:0;color:#fff;border-radius:8px;cursor:pointer">☰</button><img id="hdrLogo" alt="" style="height:30px;width:30px;border-radius:50%;object-fit:cover;background:#fff"> <span id="hdrName">GM Model School</span></div>
  <div class="h-actions">
    <button onclick="toggleTheme()" title="Theme">🌓</button>
    <button onclick="openSettings()" title="Settings">⚙️</button>
  </div>
</header>

<div class="dr-ov" id="drOv" onclick="closeMenu()"></div>
<aside class="drawer" id="drawer"></aside>
<main id="main"></main>

<div class="modal-bg" id="pwModal">
  <div class="modal">
    <h3>🔒 Password Required</h3>
    <p id="pwMsg">Enter admin password to confirm this action.</p>
    <input type="password" id="pwInput" placeholder="Enter password" autocomplete="off" onkeydown="if(event.key==='Enter')confirmPw()">
    <div class="modal-actions">
      <button class="btn s" onclick="closePw()">Cancel</button>
      <button class="btn d" onclick="confirmPw()">Confirm</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="genModal">
  <div class="modal" id="genModalBody"></div>
</div>

<div id="printArea"></div>
<div class="toast" id="toast"></div>

const today = () => { const d = new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };
const currentMonth = () => MONTHS[new Date().getMonth()] + ' ' + new Date().getFullYear();
const monthList = () => {
  const out = [], now = new Date();
  for (let i = 0; i < 24; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    out.push(MONTHS[d.getMonth()] + ' ' + d.getFullYear());
  }
  return out;
};
function monthYearPrefix(label){
  const [m, y] = String(label).split(' ');
  return y + '-' + pad2(MONTHS.indexOf(m) + 1);
}
// Fee/salary entry ki date ke mutabiq month label (e.g. "2026-10-05" -> "Oct 2026")
function monthFromDate(d){ const p = String(d||'').split('-'); return p.length>=2 ? MONTHS[(+p[1])-1]+' '+p[0] : ''; }

function normalizeDB(){
  const base = JSON.parse(JSON.stringify(DEFAULT_DB));
  db = Object.assign(base, db);
  db.settings = Object.assign({}, DEFAULT_DB.settings, db.settings || {});
  if (!db.settings.schoolName || db.settings.schoolName === 'School Management') db.settings.schoolName = 'GM Model School';
  if (db.settings.address === undefined || db.settings.address === null) db.settings.address = 'Amjad Town, Burewala';
  ['students','fees','results','staff','salaries','expenses','attendance','tatt','deleted'].forEach(k => { if(!Array.isArray(db[k])) db[k] = []; });
}
function loadDB() {
  try {
    const raw = localStorage.getItem('schoolDB_v2');
    if (raw) db = JSON.parse(raw);
  } catch(e) { console.warn('DB load failed', e); }
  normalizeDB();
}
function saveDB() {
  try { localStorage.setItem('schoolDB_v2', JSON.stringify(db)); return true; }
  catch(e) { toast('Storage full or blocked!', 'err'); return false; }
}

function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast ' + type, 2400);

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const jsq = s => String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");

const byClassThenRoll = (a,b) => {
  const ca = String(a.cls||''), cb = String(b.cls||'');
  if (ca !== cb) return ca.localeCompare(cb, undefined, {numeric:true});
  return (+a.roll||0) - (+b.roll||0);
};
const classNamesOf = list => [...new Set(list.map(s => s.cls || 'Unassigned'))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));

function grade(p){
  if (p >= 90) return 'A+'; if (p >= 80) return 'A'; if (p >= 70) return 'B';
  if (p >= 60) return 'C'; if (p >= 50) return 'D'; if (p >= 40) return 'E'; return 'F';
}

function softDelete(entity, id) {
  const item = db[entity].find(x => x.id == id);
  if (!item) return false;
  item.deleted = true; item.deletedAt = today();
  db.deleted.push({ id: uid(), entity, refId: id, name: item.name || '—', date: today() });
  saveDB(); return true;
}
function restoreItem(entity, id) {
  const item = db[entity].find(x => x.id == id);
  if (!item) return false;
  delete item.deleted; delete item.deletedAt;
  db.deleted = db.deleted.filter(d => !(d.entity === entity && d.refId == id));
  saveDB(); return true;
}

// Fee logic
const paidFor = (sid, month) => sum(db.fees.filter(f => f.sid == sid && f.month == month));
function feeStatus(student, month) {
  if (!student) return 'unpaid';
  const paid = paidFor(student.id, month), fee = +student.fee || 0;
  if (fee > 0 && paid >= fee) return 'paid';
  if (paid > 0) return 'part';
  return 'unpaid';
}
function feeBadge(status) {
  const labels = { paid: 'Paid', part: 'Partial', unpaid: 'Unpaid' };
  return `<span class="badge ${status}">${labels[status] || status}</span>`;
}

// fields: [{n, l, t, v, opts, req}]
function openForm(title, fields, onSave, btn){
  formSaveFn = onSave;
  openModal(`<h3>${title}</h3>
    <form id="genForm" onsubmit="submitGenForm(event)" style="grid-template-columns:1fr">
      ${fields.map(f => `<label>${f.l}

          ? `<select name="${f.n}">${f.opts.map(o => `<option ${String(o)===String(f.v)?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select>`
          : `<input name="${f.n}" type="${f.t||'text'}" ${f.t==='number'?'step="any"':''} value="${escapeHtml(f.v ?? '')}" ${f.req?'required':''}>`}
      </label>`).join('')}
      <div class="modal-actions" style="grid-column:1/-1">
        <button type="button" class="btn s" onclick="closeGen()">Cancel</button>

function submitGenForm(e){
  e.preventDefault();
  const data = {}; new FormData(e.target).forEach((v,k) => data[k] = v);
  const fn = formSaveFn; formSaveFn = null;
  if (fn) fn(data);
}

function uploadLogo(input){
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 500 / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      db.settings.logo = c.toDataURL('image/png'); saveDB(); toast('Logo updated', 'ok'); render(); openSettings();
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
}
function exportBackup() {
  db.settings.lastBackup = today(); saveDB();
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'school-backup-' + today() + '.json'; a.click();
  toast('Backup downloaded', 'ok');
}
function importBackup(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (typeof data !== 'object' || !Array.isArray(data.students)) throw new Error('bad');
      if (!confirm('This will replace ALL current data. Continue?')) return;
      db = data; normalizeDB(); saveDB(); applyTheme(); closeGen(); render(); toast('Data restored', 'ok');
    } catch(e) { toast('Invalid backup file', 'err'); }
  };
  reader.readAsText(file);
}
function clearAllData() {
  requirePassword('Enter password to CLEAR ALL data. This cannot be undone!', () => {
    if (!confirm('Are you absolutely sure? All records will be lost.')) return;
    db = JSON.parse(JSON.stringify(DEFAULT_DB)); saveDB(); applyTheme(); closeGen(); render(); toast('All data cleared', 'ok');
  });
}

// ===================== DASHBOARD =====================
function monthTotals(label){
  const pre = monthYearPrefix(label);
  return {
    fees: sum(db.fees.filter(f => f.month === label)),
    out: sum(db.salaries.filter(s => s.month === label)) + sum(db.expenses.filter(e => (e.date||'').startsWith(pre)))
  };
}
function renderDashboard() {
  const cm = currentMonth();
  const totalFees = sum(db.fees), totalSalaries = sum(db.salaries), totalExpenses = sum(db.expenses);
  const balance = totalFees - totalSalaries - totalExpenses;
  const act = activeStudents();
  const paidThisMonth = act.filter(s => feeStatus(s, cm) === 'paid').length;
  const unpaidThisMonth = act.length - paidThisMonth;
  const monthFees = sum(db.fees.filter(f => f.month === cm));
  const expectedFees = sum(act, 'fee');
  const pendingAmt = act.reduce((t, s) => t + Math.max(0, (+s.fee||0) - paidFor(s.id, cm)), 0);

  const stats = [
    ['Active Students', act.length, ''], ['Active Staff', activeStaff().length, ''],
    ['Paid This Month', paidThisMonth, 'pos'], ['Unpaid This Month', unpaidThisMonth, 'neg'],
    ['This Month Collected', `${fmt(monthFees)}`, 'pos'], ['This Month Pending', fmt(pendingAmt), 'neg'],
    ['Expected Monthly', fmt(expectedFees), ''], ['Total Fees Collected', fmt(totalFees), 'pos'],
    ['Total Salaries Paid', fmt(totalSalaries), ''], ['Total Expenses', fmt(totalExpenses), ''],
    ['Net Balance', fmt(balance), balance >= 0 ? 'pos' : 'neg']
  ];

  const cls = {};
  act.forEach(s => { const c = s.cls || 'Unassigned'; cls[c] = (cls[c] || 0) + 1; });

  // last 6 months chart
  const ms = monthList().slice(0, 6).reverse().map(m => ({ m, ...monthTotals(m) }));
  const mx = Math.max(1, ...ms.map(x => Math.max(x.fees, x.out)));
  const chart = `<div class="bars">${ms.map(x => `
    <div class="bgrp"><div class="bpair">
      <div class="bar in" style="height:${x.fees/mx*100}%"></div>
      <div class="bar out" style="height:${x.out/mx*100}%"></div></div>
      <small>${x.m.split(' ')[0]}</small></div>`).join('')}</div>
    <div class="legend"><span class="dot" style="background:var(--success)"></span>Fees income
    <span class="dot" style="background:var(--danger)"></span>Salaries + Expenses</div>`;

  // today's attendance
  const td = today();
  const attToday = db.attendance.filter(a => a.date === td);
  const attLine = ['Present','Absent','Leave'].map(k => `${k}: <b>${attToday.filter(a=>a.st===k).length}</b>`).join(' &nbsp;·&nbsp; ');

  // recent payments
  const recent = db.fees.slice().sort((a,b) => String(b.date).localeCompare(String(a.date)) || b.id - a.id).slice(0, 5);

  // top defaulters
  const defaulters = act.map(s => ({ s, due: Math.max(0, (+s.fee||0) - paidFor(s.id, cm)) }))
    .filter(x => x.due > 0).sort((a,b) => b.due - a.due).slice(0, 5);

  const backupWarn = (!db.settings.lastBackup || (Date.now() - new Date(db.settings.lastBackup).getTime()) > 14*86400000) && (db.students.length || db.fees.length)
    ? `<div class="warnbox">⚠️ Data sirf is browser mein save hai. Backup nahi liya gaya (ya 14 din se purana hai). <a href="#" onclick="exportBackup();render();return false">Abhi backup lein</a></div>` : '';

  return `
    ${backupWarn}
    <div class="grid">${stats.map(([l, v, c]) => `<div class="card stat"><span>${l}</span><b class="${c}">${v}</b></div>`).join('')}</div>
    <div class="card"><h3>Last 6 Months</h3>${chart}</div>
    <div class="card"><h3>Today's Attendance (Students) — ${td}</h3>${attLine}</div>
    <div class="card"><h3>Students by Class</h3>
      ${Object.keys(cls).length ? Object.entries(cls).sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true})).map(([c, n]) => `<b>${escapeHtml(c)}</b>: ${n}`).join(' &nbsp;·&nbsp; ') : '<div class="empty">No students added yet</div>'}
    </div>
    <div class="card"><h3>Recent Fee Payments</h3>
      ${recent.map(f => `<div style="padding:6px 0;border-bottom:1px solid var(--border)">${escapeHtml((findStudent(f.sid)||{}).name || '—')} — <b>${fmt(f.amt)}</b> <small style="color:var(--muted)">${escapeHtml(f.month||'')} · ${escapeHtml(f.date||'')}</small></div>`).join('') || '<div class="empty">No payments yet</div>'}
    </div>
    <div class="card"><h3>Highest Pending — ${cm}</h3>
      ${defaulters.map(x => `<div style="padding:6px 0;border-bottom:1px solid var(--border)">${escapeHtml(x.s.name)} <small style="color:var(--muted)">(Class ${escapeHtml(x.s.cls||'—')})</small> — <b class="neg">${fmt(x.due)}</b></div>`).join('') || '<div class="empty">Koi pending fee nahi ✅</div>'}
    </div>`;
}

        ${STUDENT_FIELDS.map(([f, l, t]) => {
          const val = editData ? (editData[f] ?? '') : (f === 'date' ? today() : f === 'adm' ? nextAdm() : '');
          return `<label>${l}<input name="${f}" type="${t}" ${t === 'number' ? 'step="any"' : ''} value="${escapeHtml(val)}" ${f === 'name' ? 'required' : ''}></label>`;
        }).join('')}

          <button class="btn">${editData ? '💾 Update' : '➕ Add Student'}</button>
          ${editData ? `<button type="button" class="btn s" onclick="editing=null;render()">Cancel</button>` : ''}
        </div>
      </form>
    </div>`;

  const rows = students.map(s => `
      <tr>
        <td>${escapeHtml(s.adm || '')}</td>
        <td><a href="#" onclick="studentProfile(${s.id});return false" style="color:var(--primary);text-decoration:none">${escapeHtml(s.name || '')}</a></td>
        <td>${escapeHtml(s.cls || '')}</td><td>${escapeHtml(s.roll || '')}</td>
        <td>${escapeHtml(s.phone || '')}</td><td>${fmt(s.fee)}</td>
        <td>${feeBadge(feeStatus(s, cm))}</td>
        <td>
          <button class="icon-btn" onclick="studentProfile(${s.id})" title="Profile">👁️</button>
          <button class="icon-btn" onclick="feeCardDialog(${s.id})" title="Fee card">🪪</button>
          <button class="icon-btn" onclick="resultDialog(${s.id})" title="Result card">📄</button>
          <button class="icon-btn" onclick="editStudent(${s.id})" title="Edit">✏️</button>
          <button class="icon-btn" onclick="deleteStudent(${s.id})" title="Delete">🗑️</button>
        </td>
      </tr>`).join('');

  return formHtml + `
    <div class="card">
      <h3>Students List (${students.length}/${all.length})
        <span class="row-actions" style="margin:0">
          <button class="btn s sm" onclick="exportStudentsCSV()">⬇ CSV</button>
          <button class="btn s sm" onclick="promoteDialog()">⬆ Promote Class</button>
        </span>
      </h3>
      <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
        <label>Search<input id="stuSearchBox" value="${escapeHtml(stuSearch)}" oninput="stuSearch=this.value;render()" placeholder="Name / Adm / Roll / Phone"></label>
        <label>Class<select onchange="stuClass=this.value;render()">
          <option value="">All</option>${classNamesOf(all).map(c => `<option ${c===stuClass?'selected':''}>${escapeHtml(c)}</option>`).join('')}
        </select></label>
      </div>
      <div class="w"><table>
        <thead><tr><th>Adm No.</th><th>Name</th><th>Class</th><th>Roll</th><th>Phone</th><th>Fee</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="8" class="empty">No students found.</td></tr>`}</tbody>
      </table></div>
      <p class="hint">💡 Deleted students ki fee history reports mein rehti hai.</p>
    </div>`;
}
function saveStudent(e) {
  e.preventDefault();
  const data = {}; new FormData(e.target).forEach((v, k) => data[k] = v.trim());
  const dup = db.students.find(s => !s.deleted && data.adm && String(s.adm) === data.adm && !(editing && s.id == editing.id));
  if (dup) { toast('Yeh Admission No. pehle se maujood hai', 'err'); return; }
  if (editing && editing.entity === 'students') {
    updateRecord('students', editing.id, data); toast('Student updated', 'ok'); editing = null;
  } else { addRecord('students', data); toast('Student added', 'ok'); }
  render();
}
function editStudent(id) { editing = { entity: 'students', id }; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); }
function deleteStudent(id) {
  requirePassword('Enter password to delete this student.', () => {
    if (!confirm('Delete this student? Their fee records will remain in reports.')) return;
    if (softDelete('students', id)) { toast('Student deleted (history kept)', 'ok'); editing = null; render(); }
  });
}
function exportStudentsCSV(){
  downloadCSV('students', [['Adm','Name','Father','Mother','Class','Roll','Phone','Address','Fee','Admission Date']]
    .concat(activeStudents().sort(byClassThenRoll).map(s => [s.adm,s.name,s.father,s.mother,s.cls,s.roll,s.phone,s.addr,s.fee,s.date])));
}
function promoteDialog(){
  const classes = classNamesOf(activeStudents());
  if (!classes.length) { toast('Pehle students add karein', 'err'); return; }
  openModal(`<h3>⬆ Promote Class</h3>
    <p>Ek class ke tamam students ko dusri class mein move karein (naye saal ke liye). Roll numbers wese hi rahenge.</p>
    <label>From Class<select id="pFrom">${classes.map(c => `<option>${escapeHtml(c)}</option>`).join('')}</select></label>
    <label style="margin-top:8px">To Class<input id="pTo" placeholder="e.g. 6"></label>
    <div class="modal-actions"><button class="btn s" onclick="closeGen()">Cancel</button><button class="btn" onclick="doPromote()">Promote</button></div>`);
}
function doPromote(){
  const from = document.getElementById('pFrom').value, to = document.getElementById('pTo').value.trim();
  if (!to) { toast('Nayi class likhein', 'err'); return; }
  const list = activeStudents().filter(s => (s.cls || 'Unassigned') === from);
  if (!confirm(`${list.length} students Class ${from} se Class ${to} mein move honge. Continue?`)) return;
  list.forEach(s => s.cls = to); saveDB(); closeGen(); toast(list.length + ' students promoted', 'ok'); render();
}
function studentProfile(id){
  const s = findStudent(id); if (!s) return;
  const att = db.attendance.filter(a => a.sid == id);
  const cnt = k => att.filter(a => a.st === k).length;
  const pct = att.length ? (cnt('Present') / att.length * 100).toFixed(0) : '—';
  const months = monthList().slice(0, 6);
  const total = sum(db.fees.filter(f => f.sid == id));
  openModal(`<h3>🎓 ${escapeHtml(s.name)}</h3>
    <p>Father: ${escapeHtml(s.father||'—')} · Mother: ${escapeHtml(s.mother||'—')}<br>
    Class ${escapeHtml(s.cls||'—')} · Roll ${escapeHtml(s.roll||'—')} · Adm ${escapeHtml(s.adm||'—')}<br>
    Phone: ${escapeHtml(s.phone||'—')} · ${escapeHtml(s.addr||'')}<br>Monthly Fee: <b>${fmt(s.fee)}</b> · Total paid: <b>${fmt(total)}</b></p>
    <h3 style="font-size:14px">Fee status (last 6 months)</h3>
    <div class="w"><table><tbody>${months.map(m => `<tr><td>${m}</td><td>${fmt(paidFor(id,m))}</td><td>${feeBadge(feeStatus(s,m))}</td></tr>`).join('')}</tbody></table></div>
    <h3 style="font-size:14px;margin-top:12px">Attendance</h3>
    <p>Present: <b>${cnt('Present')}</b> · Absent: <b>${cnt('Absent')}</b> · Leave: <b>${cnt('Leave')}</b> · Rate: <b>${pct}${att.length?'%':''}</b></p>
    <div class="modal-actions"><button class="btn s" onclick="closeGen()">Close</button>

}

function renderFees() {
  const act = activeStudents();

    </div></div>`;

  if (feeClass && classes[feeClass]) {
    const q = feeSearch.toLowerCase();

      .sort((a, b) => (+a.roll || 0) - (+b.roll || 0));

      <div class="row-actions" style="margin:0 0 8px"><button class="btn s sm" onclick="classFeeCardDialog()">🖨 Fee Cards (whole class)</button></div>

        ${list.map(s => `<div class="srow ${s.id == feeStudent ? 'sel' : ''}" onclick="feeStudent=${s.id};render()">
            <b>Roll ${escapeHtml(s.roll || '—')}</b> · Adm ${escapeHtml(s.adm || '—')} ${feeBadge(feeStatus(s, currentMonth()))}
            <br>${escapeHtml(s.name)} <small style="color:var(--muted)">(Father: ${escapeHtml(s.father || '—')})</small></div>`).join('') || '<div class="empty">No match found</div>'}
      </div></div>`;
  }

  const st = findStudent(feeStudent);
  if (st && !st.deleted) {
    const myFees = db.fees.filter(f => f.sid == st.id);

      const paid = paidFor(st.id, m), due = Math.max(0, (+st.fee||0) - paid);

    }).join('');

      <p style="margin-bottom:10px"><b>${escapeHtml(st.name)}</b> (Father: ${escapeHtml(st.father || '—')})<br>
        <small style="color:var(--muted)">Class ${escapeHtml(st.cls || '—')} · Roll ${escapeHtml(st.roll || '—')} · Monthly Fee ${fmt(st.fee)} · Total paid ${fmt(sum(myFees))}</small></p>
      <div class="w" style="margin-bottom:10px"><table><thead><tr><th>Month</th><th>Paid</th><th>Due</th><th>Status</th></tr></thead><tbody>${grid}</tbody></table></div>
      <form onsubmit="saveFee(event)">
        <label>Month<select name="month">${monthList().map(m => `<option>${m}</option>`).join('')}</select></label>
        <label>Amount<input name="amt" type="number" step="any" min="0" value="${st.fee || ''}" required></label>
        <label>Date<input name="date" type="date" value="${today()}"></label>
        <label>Method<select name="method"><option>Cash</option><option>Bank</option><option>Online</option><option>Cheque</option></select></label>
        <label>Receipt No.<input name="receipt" value="${nextReceipt()}"></label>
        <label>Note<input name="note" placeholder="Optional"></label>
        <div class="row-actions" style="grid-column:1/-1"><button class="btn">💰 Save Payment</button><button type="button" class="btn s" onclick="feeCardDialog(${st.id})">🪪 Fee Card</button></div>
      </form></div>`;
  }

  const filteredFees = db.fees.filter(f => {
    if (!feeClass) return true;
    const s = findStudent(f.sid); return s && (s.cls || 'Unassigned') === feeClass;
  }).filter(f => !feeStudent || f.sid == feeStudent);

  html += `<div class="card"><h3>Fee Records ${feeClass ? '— Class ' + escapeHtml(feeClass) : ''}${feeStudent ? ' (selected student)' : ''}
      <button class="btn s sm" onclick="exportFeesCSV()">⬇ CSV</button></h3>
    <p style="margin-bottom:8px"><b>Total: ${fmt(sum(filteredFees))}</b></p>
    <div class="w"><table>
      <thead><tr><th>Receipt</th><th>Student</th><th>Month</th><th>Amount</th><th>Method</th><th>Date</th><th>Actions</th></tr></thead>

        const s = findStudent(f.sid) || {};

          <td>${escapeHtml(s.name || '—')}${s.deleted ? ' <span class="badge left">Left</span>' : ''}</td>
          <td>${escapeHtml(f.month || '')}</td><td>${fmt(f.amt)}</td><td>${escapeHtml(f.method || '')}</td><td>${escapeHtml(f.date || '')}</td>

function nextReceipt(){
  const nums = db.fees.map(f => /^R-(\d+)$/.exec(f.receipt || '')).filter(Boolean).map(m => +m[1]);
  return 'R-' + String((nums.length ? Math.max(...nums) : 1000) + 1);
}
function saveFee(e) {
  e.preventDefault();
  const data = { sid: feeStudent };
  new FormData(e.target).forEach((v, k) => data[k] = v);
  const st = findStudent(feeStudent);
  if (!(+data.amt > 0)) { toast('Amount sahi likhein', 'err'); return; }
  if (db.fees.some(f => f.receipt && f.receipt === data.receipt)) { toast('Yeh receipt number pehle use ho chuka hai', 'err'); return; }
  const fee = +st.fee || 0, already = paidFor(st.id, data.month);
  if (fee > 0 && already + (+data.amt) > fee && !confirm(`${data.month} ki fee ${fmt(fee)} hai, aur ${fmt(already)} pehle jama ho chuki hai.\nYeh payment fee se zyada ho jaye gi. Phir bhi save karein?`)) return;
  const rec = addRecord('fees', data);
  toast('Fee saved', 'ok');
  render();
  if (confirm('Receipt print karni hai?')) printReceipt(rec.id);
}
function editFee(id) {
  const f = db.fees.find(x => x.id == id); if (!f) return;
  const months = monthList(); if (!months.includes(f.month)) months.push(f.month);
  openForm('✏️ Edit Fee Payment', [
    { n:'month', l:'Month', opts: months, v: f.month },
    { n:'amt', l:'Amount', t:'number', v: f.amt, req:true },
    { n:'date', l:'Date', t:'date', v: f.date },
    { n:'method', l:'Method', opts:['Cash','Bank','Online','Cheque'], v: f.method },
    { n:'receipt', l:'Receipt No.', v: f.receipt },
    { n:'note', l:'Note', v: f.note }
  ], data => { updateRecord('fees', id, data); closeGen(); toast('Fee updated', 'ok'); render(); });
}
function deleteFee(id) {
  requirePassword('Enter password to delete this fee record.', () => {
    db.fees = db.fees.filter(f => f.id != id); saveDB(); toast('Fee record deleted', 'ok'); render();
  });
}
function exportFeesCSV(){
  downloadCSV('fees', [['Receipt','Student','Class','Month','Amount','Method','Date','Note']]
    .concat(db.fees.map(f => { const s = findStudent(f.sid) || {}; return [f.receipt, s.name, s.cls, f.month, f.amt, f.method, f.date, f.note]; })));
}
function printReceipt(id){
  const f = db.fees.find(x => x.id == id); if (!f) return;
  const s = findStudent(f.sid) || {};
  const fee = +s.fee || 0, paid = paidFor(f.sid, f.month), due = Math.max(0, fee - paid);
  printDoc(`<div style="max-width:420px;margin:0 auto;border:2px solid #000;padding:16px;font-family:system-ui,sans-serif">
    ${letterhead()}

      ${[['Receipt No.', f.receipt||'—'],['Date', f.date||'—'],['Student', s.name||'—'],['Father', s.father||'—'],
         ['Class / Roll', (s.cls||'—')+' / '+(s.roll||'—')],['Adm No.', s.adm||'—'],['Month', f.month||'—'],
         ['Method', f.method||'—'],['Amount Received', fmt(f.amt)],['Monthly Fee', fmt(fee)],
         ['Total Paid (month)', fmt(paid)],['Remaining Due', fmt(due)]].map(([k,v]) =>
        `<tr><td style="padding:5px 0;border-bottom:1px solid #999;color:#000"><b>${k}</b></td><td style="padding:5px 0;border-bottom:1px solid #999;text-align:right;color:#000">${escapeHtml(v)}</td></tr>`).join('')}
    </table>
    ${f.note ? `<p style="margin-top:8px;color:#000">Note: ${escapeHtml(f.note)}</p>` : ''}
    <div style="display:flex;justify-content:space-between;margin-top:40px;font-size:13px;color:#000"><span>_____________<br>Parent Sign</span><span>_____________<br>Accountant Sign</span></div>
  </div>`);
}

function renderResults() {
  const act = activeStudents();
  const classes = {};
  act.forEach(s => { const c = s.cls || 'Unassigned'; (classes[c] = classes[c] || []).push(s); });

  let html = `<div class="card"><h3>Step 1: Select Class</h3><div class="chips">

  }

  if (st && !st.deleted) {
    html += `<div class="card"><h3>Step 3: Add Result</h3>

        <label>Total Marks<input name="tot" type="number" step="any" min="1" required></label>
        <div class="row-actions" style="grid-column:1/-1"><button class="btn">📝 Add Subject Result</button></div>
      </form></div>`;
  }

  if (st && !st.deleted) {
    const combos = [...new Set(db.results.filter(r => r.sid == st.id).map(r => r.exam + '|' + (r.year || '')))];
    html += `<div class="card"><h3>🎓 Generate Result Card — ${escapeHtml(st.name)}</h3>
      ${combos.length ? `<label>Exam<select id="genExam">${combos.map(c => { const [e, y] = c.split('|'); return `<option value="${escapeHtml(c)}">${escapeHtml(e)} — ${escapeHtml(y || '—')}</option>`; }).join('')}</select></label>
      <div class="row-actions"><button class="btn" onclick="generateResult()">🖨 Generate &amp; Print Result</button></div>
      <p class="hint">Result card par school ka naam, address aur logo (page ke beech mein) aayega.</p>` : '<div class="empty">Is student ka koi result add nahi hua. Pehle upar subject results add karein.</div>'}</div>`;
  }

  const filtered = db.results.filter(r => {
    const s = findStudent(r.sid); if (!s) return false;
    if (resStudent && r.sid != resStudent) return false;
    if (resClass && (s.cls || 'Unassigned') !== resClass) return false;
    return true;
  });
  const grouped = {};
  filtered.forEach(r => {
    const key = `${r.sid}|${r.exam}|${r.year || ''}`;
    if (!grouped[key]) grouped[key] = { sid: r.sid, exam: r.exam, year: r.year, rows: [] };
    grouped[key].rows.push(r);
  });

  html += `<h3 style="margin:14px 4px 8px;font-size:15px">Results ${resClass ? '— Class ' + escapeHtml(resClass) : '(All Classes)'}</h3>`;
  html += Object.values(grouped).map(g => {
    const s = findStudent(g.sid) || {};
    const got = sum(g.rows, 'got'), tot = sum(g.rows, 'tot');

    return `<div class="card">

          <tr><td>${escapeHtml(y.sub)}</td><td>${y.got}</td><td>${y.tot}</td><td>${p.toFixed(1)}%</td><td>${grade(p)}</td>
          <td><button class="icon-btn" onclick="editResult(${y.id})">✏️</button><button class="icon-btn" onclick="deleteResult(${y.id})">🗑️</button></td></tr>`; }).join('')}
          <tr><th>Total</th><th>${got}</th><th>${tot}</th><th>${pct.toFixed(1)}%</th><th>${grade(pct)}</th><th></th></tr>
        </tbody></table></div></div>`;
  }).join('') || '<div class="card"><div class="empty">No results yet</div></div>';
  return html;
}
function saveResult(e) {
  e.preventDefault();
  const data = { sid: resStudent }; new FormData(e.target).forEach((v, k) => data[k] = v);
  if (+data.got > +data.tot) { toast('Obtained marks total se zyada nahi ho sakte', 'err'); return; }
  addRecord('results', data); toast('Result added', 'ok');
  const sub = e.target.elements.sub, got = e.target.elements.got;
  sub.value = ''; got.value = ''; render();
  const el = document.querySelector('form input[name="sub"]'); if (el) el.focus();
}
function editResult(id){
  const r = db.results.find(x => x.id == id); if (!r) return;

function resultCardHTML(sid, exam, year){
  const s = findStudent(sid) || {};
  const rows = db.results.filter(r => r.sid == sid && r.exam === exam && String(r.year||'') === String(year));
  const got = sum(rows,'got'), tot = sum(rows,'tot'), pct = tot ? got/tot*100 : 0;
  // position in class for same exam
  const classmates = db.students.filter(x => !x.deleted && (x.cls||'') === (s.cls||''));
  const totals = classmates.map(c => {
    const rr = db.results.filter(r => r.sid == c.id && r.exam === exam && String(r.year||'') === String(year));
    const t = sum(rr,'tot'); return { id: c.id, p: t ? sum(rr,'got')/t*100 : -1 };
  }).filter(x => x.p >= 0).sort((a,b) => b.p - a.p);
  const pos = totals.findIndex(x => x.id == sid) + 1;
  const cell = 'padding:6px;border:1px solid #000;color:#000';
  return `<div style="max-width:600px;margin:0 auto;border:2px solid #000;padding:16px;font-family:system-ui,sans-serif;color:#000">

      ${rows.map(r => { const p = (+r.tot) ? (+r.got)/(+r.tot)*100 : 0; return `<tr><td style="${cell}">${escapeHtml(r.sub)}</td><td style="${cell}">${r.got}</td><td style="${cell}">${r.tot}</td><td style="${cell}">${p.toFixed(1)}%</td><td style="${cell}">${grade(p)}</td></tr>`; }).join('')}
      <tr><th style="${cell}">Total</th><th style="${cell}">${got}</th><th style="${cell}">${tot}</th><th style="${cell}">${pct.toFixed(1)}%</th><th style="${cell}">${grade(pct)}</th></tr>

function feeCardHTML(sid, year){
  const s = findStudent(sid) || {}, fee = +s.fee || 0;
  const now = new Date(), nowIdx = now.getFullYear() * 12 + now.getMonth();
  const a = String(s.date || '').split('-'), admIdx = a.length >= 2 ? (+a[0]) * 12 + (+a[1] - 1) : -1e9;
  let totFee = 0, totPaid = 0, totDue = 0;
  const cell = 'padding:5px 6px;border:1px solid #000;color:#000;font-size:12.5px';
  const rows = MONTHS.map((m, i) => {
    const label = m + ' ' + year, idx = (+year) * 12 + i;
    const pays = db.fees.filter(f => f.sid == sid && f.month === label);
    const paid = sum(pays); totPaid += paid;
    let due = 0, status = '—', shown = '—';
    if (idx >= admIdx && idx <= nowIdx) {
      due = Math.max(0, fee - paid); totFee += fee; totDue += due; shown = fmt(fee);
      status = fee > 0 && paid >= fee ? 'Paid' : paid > 0 ? 'Partial' : 'Unpaid';
    } else if (paid > 0) status = 'Advance';
    return `<tr><td style="${cell}">${m}</td><td style="${cell}">${shown}</td><td style="${cell}">${paid ? fmt(paid) : '—'}</td>
      <td style="${cell}">${shown === '—' ? '—' : fmt(due)}</td><td style="${cell}">${status}</td>
      <td style="${cell}">${escapeHtml(pays.map(f => f.receipt || '').filter(Boolean).join(', ') || '—')}</td>
      <td style="${cell}">${escapeHtml(pays.map(f => f.date || '').filter(Boolean).join(', ') || '—')}</td></tr>`;
  }).join('');
  const det = (k, v) => `<td style="padding:3px 6px;color:#000"><b>${k}:</b> ${escapeHtml(v || '—')}</td>`;
  return `<div style="max-width:700px;margin:0 auto;border:2px solid #000;padding:16px;font-family:system-ui,sans-serif;color:#000">
    ${letterhead()}
    <p style="text-align:center;margin-bottom:10px"><b>FEE CARD — ${escapeHtml(year)}</b></p>
    <table style="width:100%;font-size:13.5px;border-collapse:collapse;margin-bottom:10px">
      <tr>${det('Name', s.name)}${det('Father', s.father)}</tr>
      <tr>${det('Class', s.cls)}${det('Roll No.', s.roll)}</tr>
      <tr>${det('Adm No.', s.adm)}${det('Admission Date', s.date)}</tr>
      <tr>${det('Phone', s.phone)}${det('Monthly Fee', fmt(fee))}</tr>
      <tr><td colspan="2" style="padding:3px 6px;color:#000"><b>Address:</b> ${escapeHtml(s.addr || '—')}</td></tr>
    </table>
    <table style="width:100%;border-collapse:collapse">
      <tr><th style="${cell}">Month</th><th style="${cell}">Fee</th><th style="${cell}">Paid</th><th style="${cell}">Due</th><th style="${cell}">Status</th><th style="${cell}">Receipt</th><th style="${cell}">Date</th></tr>
      ${rows}
      <tr><th style="${cell}">Total</th><th style="${cell}">${fmt(totFee)}</th><th style="${cell}">${fmt(totPaid)}</th><th style="${cell}">${fmt(totDue)}</th><th style="${cell}" colspan="3"></th></tr>
    </table>
    <p style="margin-top:8px;color:#000"><b>Total Pending Balance: ${fmt(totDue)}</b></p>
    <div style="display:flex;justify-content:space-between;margin-top:50px;font-size:13px;color:#000"><span>_____________<br>Parent Sign</span><span>_____________<br>Accountant Sign</span></div>
  </div>`;
}

function attList(){ return db[attType === 'student' ? 'attendance' : 'tatt']; }
function attKey(){ return attType === 'student' ? 'sid' : 'tid'; }
function getAtt(id){ return attList().find(a => a.date === attDate && a[attKey()] == id); }
function setAtt(id, status){
  const rec = getAtt(id);
  if (rec) rec.st = status; else attList().push({ id: uid(), [attKey()]: id, date: attDate, st: status });
  saveDB(); render();
}
function markAll(ids, status){
  ids.forEach(id => { const rec = getAtt(id); if (rec) rec.st = status; else attList().push({ id: uid(), [attKey()]: id, date: attDate, st: status }); });
  saveDB(); render(); toast('Sab ' + status + ' mark ho gaye', 'ok');
}
function renderAttendance() {
  const isStudent = attType === 'student';
  const people = isStudent ? activeStudents() : activeStaff();
  const classes = {};
  if (isStudent) people.forEach(s => { const c = s.cls || 'Unassigned'; (classes[c] = classes[c] || []).push(s); });

  const buttons = id => {
    const cur = (getAtt(id) || {}).st;
    return `<div class="row-actions">${[['Present','p'],['Absent','a'],['Leave','l']].map(([t, c]) =>
      `<button class="attbtn ${cur === t ? c : ''}" onclick="setAtt(${id},'${t}')">${t}</button>`).join('')}</div>`;
  };

  let html = `<div class="card">
    <div class="tabs">
      <button class="${isStudent ? 'on' : ''}" onclick="attType='student';render()">🎓 Students</button>
      <button class="${!isStudent ? 'on' : ''}" onclick="attType='staff';render()">👨‍🏫 Staff</button>
    </div>
    <label style="margin-top:10px">Date<input type="date" value="${attDate}" onchange="attDate=this.value||today();render()"></label>
  </div>`;

  const summary = list => {
    const sts = list.map(s => (getAtt(s.id) || {}).st);
    const c = k => sts.filter(x => x === k).length;
    return `<p style="margin-bottom:10px"><span class="badge paid">Present: ${c('Present')}</span> <span class="badge unpaid">Absent: ${c('Absent')}</span> <span class="badge part">Leave: ${c('Leave')}</span> <span class="badge left">Not marked: ${sts.filter(x => !x).length}</span></p>`;
  };

  if (isStudent) {
    html += `<div class="card"><h3>Select Class</h3><div class="chips">
      ${classNamesOf(people).map(c => `<button class="chip ${c === attClass ? 'on' : ''}" onclick="attClass='${jsq(c)}';render()">Class ${escapeHtml(c)}</button>`).join('') || '<div class="empty">No students</div>'}
    </div></div>`;
    if (attClass && classes[attClass]) {
      const list = classes[attClass].slice().sort((a, b) => (+a.roll || 0) - (+b.roll || 0));
      html += `<div class="card"><h3>Class ${escapeHtml(attClass)} — ${attDate}</h3>${summary(list)}
        <button class="btn sm g" onclick="markAll([${list.map(s => s.id).join(',')}],'Present')">✅ All Present</button>
        <div style="margin-top:10px">${list.map(s => `<div class="srow" style="cursor:default"><b>Roll ${escapeHtml(s.roll || '—')}</b> · ${escapeHtml(s.name)}${buttons(s.id)}</div>`).join('')}</div></div>`;
    }
  } else {
    html += `<div class="card"><h3>Staff Attendance — ${attDate}</h3>${summary(people)}
      ${people.length ? `<button class="btn sm g" onclick="markAll([${people.map(s => s.id).join(',')}],'Present')">✅ All Present</button>` : ''}
      <div style="margin-top:10px">${people.map(t => `<div class="srow" style="cursor:default"><b>${escapeHtml(t.name)}</b> <small style="color:var(--muted)">${escapeHtml(t.role || '')}</small>${buttons(t.id)}</div>`).join('') || '<div class="empty">No staff added</div>'}</div></div>`;
  }
  return html;
}

    <div class="w"><table>
      <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Paid By</th><th>Actions</th></tr></thead>
      <tbody>${records.map(e => `<tr><td>${escapeHtml(e.date || '')}</td><td>${escapeHtml(e.cat || '')}</td><td>${escapeHtml(e.desc || '')}</td><td>${fmt(e.amt)}</td><td>${escapeHtml(e.by || '')}</td>
        <td><button class="icon-btn" onclick="editExpense(${e.id})">✏️</button><button class="icon-btn" onclick="deleteExpense(${e.id})">🗑️</button></td></tr>`).join('') || `<tr><td colspan="6" class="empty">No expenses</td></tr>`}</tbody>
    </table></div></div>`;
  return html;
}
function saveExpense(e) {
  e.preventDefault();
  const data = {}; new FormData(e.target).forEach((v, k) => data[k] = v);
  if (data.cat === 'Other' && data.catOther && data.catOther.trim()) data.cat = data.catOther.trim();
  delete data.catOther;
  addRecord('expenses', data); toast('Expense saved', 'ok'); render();
}
function editExpense(id) {
  const e = db.expenses.find(x => x.id == id); if (!e) return;
  openForm('✏️ Edit Expense', [
    { n:'cat', l:'Category', v:e.cat }, { n:'desc', l:'Description', v:e.desc, req:true },
    { n:'amt', l:'Amount', t:'number', v:e.amt, req:true }, { n:'date', l:'Date', t:'date', v:e.date }, { n:'by', l:'Paid By', v:e.by }
  ], data => { updateRecord('expenses', id, data); closeGen(); toast('Expense updated', 'ok'); render(); });
}
function deleteExpense(id) {
  requirePassword('Enter password to delete this expense.', () => {
    db.expenses = db.expenses.filter(x => x.id != id); saveDB(); toast('Expense deleted', 'ok'); render();
  });
}
function exportExpensesCSV(){
  downloadCSV('expenses', [['Date','Category','Description','Amount','Paid By']].concat(db.expenses.map(e => [e.date, e.cat, e.desc, e.amt, e.by])));
}

// ===================== REPORTS =====================
function renderReports() {
  const month = sm, pre = monthYearPrefix(month);
  const monthFees = db.fees.filter(f => f.month === month);
  const monthSalaries = db.salaries.filter(s => s.month === month);
  const monthExpenses = db.expenses.filter(e => (e.date || '').startsWith(pre));
  const income = sum(monthFees), salaryOut = sum(monthSalaries), expOut = sum(monthExpenses), net = income - salaryOut - expOut;

  const expenseByCat = {};
  monthExpenses.forEach(e => expenseByCat[e.cat] = (expenseByCat[e.cat] || 0) + (+e.amt || 0));

  const pending = activeStudents().sort(byClassThenRoll).map(s => {
    const paid = paidFor(s.id, month); return { s, paid, due: Math.max(0, (+s.fee || 0) - paid) };
  }).filter(x => x.due > 0);

  // attendance summary for month
  const attRows = activeStudents().sort(byClassThenRoll).map(s => {
    const a = db.attendance.filter(x => x.sid == s.id && (x.date||'').startsWith(pre));
    const c = k => a.filter(x => x.st === k).length;
    return { s, p: c('Present'), a: c('Absent'), l: c('Leave'), n: a.length };
  }).filter(x => x.n > 0);

  const formerStudents = db.students.filter(s => s.deleted);
  const formerStaff = db.staff.filter(s => s.deleted);

  return `
    <div class="card no-print"><label>Select Month<select onchange="sm=this.value;render()">${monthList().map(m => `<option ${m === sm ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
      <div class="row-actions"><button class="btn" onclick="printPage()">🖨 Print Report</button>
      <button class="btn s" onclick="exportPendingCSV()">⬇ Pending CSV</button></div></div>
    <div class="grid">
      <div class="card stat"><span>Income (Fees)</span><b class="pos">${fmt(income)}</b></div>
      <div class="card stat"><span>Salaries Paid</span><b class="neg">${fmt(salaryOut)}</b></div>
      <div class="card stat"><span>Expenses</span><b class="neg">${fmt(expOut)}</b></div>
      <div class="card stat"><span>Net Balance</span><b class="${net >= 0 ? 'pos' : 'neg'}">${fmt(net)}</b></div>
    </div>
    <div class="card"><h3>Pending Fees — ${escapeHtml(month)} <span class="neg">${fmt(sum(pending, 'due'))}</span></h3>
      <div class="w"><table><thead><tr><th>Name</th><th>Class</th><th>Fee</th><th>Paid</th><th>Due</th></tr></thead>
      <tbody>${pending.map(x => `<tr><td>${escapeHtml(x.s.name)}</td><td>${escapeHtml(x.s.cls || '')}</td><td>${fmt(x.s.fee)}</td><td>${fmt(x.paid)}</td><td class="neg">${fmt(x.due)}</td></tr>`).join('') || `<tr><td colspan="5" class="empty">All fees cleared ✅</td></tr>`}</tbody></table></div></div>
    <div class="card"><h3>Expenses by Category — ${escapeHtml(month)}</h3>
      ${Object.keys(expenseByCat).length ? Object.entries(expenseByCat).map(([c, v]) => `<div style="padding:6px 0;border-bottom:1px solid var(--border)">${escapeHtml(c)}: <b>${fmt(v)}</b></div>`).join('') : '<div class="empty">No expenses this month</div>'}</div>
    <div class="card"><h3>Student Attendance — ${escapeHtml(month)}</h3>
      <div class="w"><table><thead><tr><th>Name</th><th>Class</th><th>Present</th><th>Absent</th><th>Leave</th><th>%</th></tr></thead>
      <tbody>${attRows.map(x => `<tr><td>${escapeHtml(x.s.name)}</td><td>${escapeHtml(x.s.cls || '')}</td><td>${x.p}</td><td>${x.a}</td><td>${x.l}</td><td>${(x.p / x.n * 100).toFixed(0)}%</td></tr>`).join('') || `<tr><td colspan="6" class="empty">Is mahine ki attendance nahi hai</td></tr>`}</tbody></table></div></div>
    <div class="card no-print"><h3>Former Students (History Preserved)</h3>
      <div class="w"><table><thead><tr><th>Name</th><th>Class</th><th>Total Paid</th><th>Left On</th><th></th></tr></thead>
      <tbody>${formerStudents.map(s => `<tr><td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.cls || '')}</td><td>${fmt(sum(db.fees.filter(f => f.sid == s.id)))}</td><td>${escapeHtml(s.deletedAt || '')}</td><td><button class="btn s sm" onclick="doRestore('students',${s.id})">↩ Restore</button></td></tr>`).join('') || `<tr><td colspan="5" class="empty">No former students</td></tr>`}</tbody></table></div></div>
    <div class="card no-print"><h3>Former Staff (History Preserved)</h3>
      <div class="w"><table><thead><tr><th>Name</th><th>Role</th><th>Total Salary Paid</th><th>Left On</th><th></th></tr></thead>
      <tbody>${formerStaff.map(s => `<tr><td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.role || '')}</td><td>${fmt(sum(db.salaries.filter(x => x.tid == s.id)))}</td><td>${escapeHtml(s.deletedAt || '')}</td><td><button class="btn s sm" onclick="doRestore('staff',${s.id})">↩ Restore</button></td></tr>`).join('') || `<tr><td colspan="5" class="empty">No former staff</td></tr>`}</tbody></table></div></div>
    <div class="card no-print"><h3>Backup & Restore</h3>
      <div class="row-actions"><button class="btn" onclick="exportBackup()">⬇ Download Backup</button></div>
      <p class="hint">Last backup: ${escapeHtml(db.settings.lastBackup || 'never')}</p></div>`;
}
function doRestore(entity, id){ if (restoreItem(entity, id)) { toast('Restore ho gaya', 'ok'); render(); } }
function exportPendingCSV(){
  const rows = activeStudents().sort(byClassThenRoll).map(s => { const paid = paidFor(s.id, sm); return [s.name, s.father, s.cls, s.roll, s.phone, s.fee, paid, Math.max(0, (+s.fee||0) - paid)]; }).filter(r => r[7] > 0);
  downloadCSV('pending-fees-' + sm.replace(' ','-'), [['Name','Father','Class','Roll','Phone','Fee','Paid','Due']].concat(rows));
}

// ===================== INIT =====================
render();
</script>
</body>
</html>
